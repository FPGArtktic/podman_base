# ===========================================================================
#  podman-wrk :: .tmux.conf
# ===========================================================================

# C-a as an additional prefix, C-b kept so muscle memory never breaks.
set -g prefix2 C-a
bind C-a send-prefix -2

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

set -g default-shell /bin/bash
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc,alacritty:Tc,foot:Tc"

# vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Intuitive splits that keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Status line
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour250"
set -g status-left  "#[bg=colour33,fg=colour232,bold] #S #[default] "
set -g status-right "#[fg=colour245]#(cd '#{pane_current_path}' && git branch --show-current 2>/dev/null) #[fg=colour250]| %H:%M #[bg=colour33,fg=colour232,bold] #h "
set -g status-left-length 30
set -g status-right-length 80
setw -g window-status-current-style "fg=colour33,bold"
